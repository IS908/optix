# Portfolio Risk Layer configuration (v2.0).
# Loaded by `optix portfolio ...` commands; absent file falls back to defaults.

concentration:
  # Single-name weight thresholds (percent of net_liq).
  warn_pct: 10.0    # yellow flag: position > 10% of NLV
  red_pct:  20.0    # red flag:    position > 20% of NLV

  # Top-N rollup display (also feeds JSON export).
  top_n:    10

  # Combined-top-K warnings.
  top2_warn_pct: 30.0   # warn if Top 2 > 30%
  top5_warn_pct: 60.0   # warn if Top 5 > 60%

  # HHI buckets (× 10000). Standard antitrust bands.
  hhi_diversified_max: 1500   # < 1500: 分散 (diversified)
  hhi_concentrated_min: 2500  # > 2500: 集中 (concentrated)

# Portfolio greeks (v2.0 Phase 2).
greeks:
  # Black-Scholes risk-free rate for portfolio greeks. Greeks are insensitive to
  # r; this is the current US short-end T-bill. Override with --risk-free-rate.
  risk_free_rate: 0.043

# IV cache staleness windows reserved for a future IV cache freshness gate.
# The values are parsed/validated today but are not consumed by greeks/stress yet.
iv_staleness:
  fresh_max:      "4h"    # ✓
  acceptable_max: "24h"   # ⚠️
  stale_max:      "168h"  # ⚠️⚠️  (= 7d); beyond this -> ✗ skipped

# Sector mapping file (ticker -> sector id, plus id -> label).
sectors_file: "./configs/sectors.json"

# Portfolio stress scenarios (v2.0 Phase 3). The first implementation applies
# shocks to the aggregated Greeks snapshot: price shocks use Dollar Δ + dollar Γ,
# IV shocks are explicit volatility points consumed by Vega(/1%).
stress:
  scenarios:
    - id: spy-down-3
      label: "SPY -3%"
      shocks:
        - axis: spy_pct
          magnitude: -0.03
    - id: spy-down-5
      label: "SPY -5%"
      shocks:
        - axis: spy_pct
          magnitude: -0.05
    - id: spy-down-10
      label: "SPY -10%"
      shocks:
        - axis: spy_pct
          magnitude: -0.10
    - id: iv-up-5
      label: "IV +5 pts"
      shocks:
        - axis: iv_points
          magnitude: 5.0
    - id: qqq-down-5
      label: "QQQ -5%"
      shocks:
        - axis: qqq_pct
          magnitude: -0.05
    - id: tech-correlated-5
      label: "Tech correlated -5%"
      shocks:
        - axis: spy_pct
          magnitude: -0.03
        - axis: iv_points
          magnitude: 3.0
